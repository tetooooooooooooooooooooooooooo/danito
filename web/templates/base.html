<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}soundcord{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="bar">
    <a class="brand" href="{{ url_for('index') }}">soundcord</a>
    {% if user %}
      <div class="who">
        <img src="{{ user.avatar }}" alt="" width="28" height="28">
        <span>{{ user.username }}</span>
        <form method="post" action="{{ url_for('logout') }}">
          <input type="hidden" name="csrf" value="{{ csrf_token() }}">
          <button class="link" type="submit">Log out</button>
        </form>
      </div>
    {% endif %}
  </header>

  <main>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>

  <footer>Changes made here reach the bot within a few seconds.</footer>
</body>
</html>
